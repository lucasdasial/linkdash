services:
  postgres:
    image: postgres:17-alpine
    container_name: rupi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rupi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rupi}
      POSTGRES_DB: ${DB_NAME:-rupi}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rupi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rupi} -d ${DB_NAME:-rupi}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rupi_pgdata:
